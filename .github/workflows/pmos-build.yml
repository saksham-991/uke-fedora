name: Build postmarketOS for Xiaomi Pad 7 (uke)

on:
  workflow_dispatch:
    inputs:
      firmware_tarball_url:
        description: "URL to firmware.tar.gz (from extract-firmware.sh on device)"
        required: false
        default: ""
      kernel_commit:
        description: "Kernel commit to build (default: latest main)"
        required: false
        default: ""

env:
  PMOS_DEVICE: xiaomi-uke
  PMOS_ARCH: aarch64
  PMOS_UI: plasma-mobile
  PMOS_USERNAME: user
  PMOS_PASSWORD: 147147
  KERNEL_REPO: https://github.com/saksham-991/senemos-uke-kernel-mainline
  KERNEL_BRANCH: main

jobs:
  build:
    name: Build pmOS (KDE Plasma Mobile)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout uke-fedora (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup pmbootstrap cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pmbootstrap
            /tmp/pmbootstrap
          key: pmos-uke-${{ github.run_id }}
          restore-keys: |
            pmos-uke-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            python3-venv \
            qemu-user-static \
            binfmt-support \
            clang \
            lld \
            llvm \
            bc \
            bison \
            flex \
            dtc \
            kmod \
            cpio \
            zstd \
            lz4 \
            android-sdk-libsparse-utils \
            fastboot \
            android-sdk-platform-tools-common

      - name: Install pmbootstrap
        run: |
          python3 -m pip install --user --break-system-packages pmbootstrap
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Download firmware tarball
        if: ${{ inputs.firmware_tarball_url != '' }}
        run: |
          echo "Downloading firmware from ${{ inputs.firmware_tarball_url }}"
          wget -q "${{ inputs.firmware_tarball_url }}" -O /tmp/firmware.tar.gz
          mkdir -p pmbootstrap/aports/device/device-xiaomi-uke/firmware
          tar -xzf /tmp/firmware.tar.gz -C pmbootstrap/aports/device/device-xiaomi-uke/firmware
          echo "Firmware extracted:"
          find pmbootstrap/aports/device/device-xiaomi-uke/firmware -type f | sort

      - name: Checkout kernel at specific commit
        if: ${{ inputs.kernel_commit != '' }}
        run: |
          cd pmbootstrap/aports/kernel/linux-xiaomi-uke
          # The prepare() function in APKBUILD handles git checkout
          # We just need to ensure the source is available
          echo "KERNEL_COMMIT=${{ inputs.kernel_commit }}" >> $GITHUB_ENV

      - name: Configure pmbootstrap
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pmbootstrap --version
          pmbootstrap init \
            --device="${PMOS_DEVICE}" \
            --arch="${PMOS_ARCH}" \
            --mirror="http://dl-cdn.alpinelinux.org/alpine/edge" \
            --username="${PMOS_USERNAME}" \
            --password="${PMOS_PASSWORD}" \
            --hostname="uke" \
            --timezone="UTC" \
            --ui="${PMOS_UI}" \
            --no-fde \
            --bootloader="" \
            --extra-packages="device-${PMOS_DEVICE} linux-${PMOS_DEVICE}" \
            --aports="${GITHUB_WORKSPACE}/pmbootstrap/aports" \
            --make-jobs=$(nproc) \
            --compiler=clang \
            --linker=lld \
            --ccache

      - name: Build kernel package
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pmbootstrap build --aports="${GITHUB_WORKSPACE}/pmbootstrap/aports" linux-xiaomi-uke

      - name: Build device package
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pmbootstrap build --aports="${GITHUB_WORKSPACE}/pmbootstrap/aports" device-xiaomi-uke

      - name: Build firmware package
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pmbootstrap build --aports="${GITHUB_WORKSPACE}/pmbootstrap/aports" firmware-qcom-sm7675

      - name: Install rootfs (creates rootfs tarball)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pmbootstrap install \
            --aports="${GITHUB_WORKSPACE}/pmbootstrap/aports" \
            --no-fde \
            --details-to-stdout

      - name: Generate boot.img
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pmbootstrap export \
            --aports="${GITHUB_WORKSPACE}/pmbootstrap/aports" \
            --bootimg-only

      - name: Generate userdata.img
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pmbootstrap export \
            --aports="${GITHUB_WORKSPACE}/pmbootstrap/aports" \
            --userdata-only

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          # boot.img location
          if [ -f ~/.local/var/pmbootstrap/chroot_rootfs_xiaomi-uke/boot/boot.img ]; then
            cp ~/.local/var/pmbootstrap/chroot_rootfs_xiaomi-uke/boot/boot.img artifacts/
          elif [ -f ~/.local/var/pmbootstrap/chroot_native/boot/boot.img ]; then
            cp ~/.local/var/pmbootstrap/chroot_native/boot/boot.img artifacts/
          else
            find ~/.local/var/pmbootstrap -name "boot.img" -type f | head -1 | xargs -I{} cp {} artifacts/
          fi
          # userdata.img location
          if [ -f ~/.local/var/pmbootstrap/chroot_rootfs_xiaomi-uke/userdata.img ]; then
            cp ~/.local/var/pmbootstrap/chroot_rootfs_xiaomi-uke/userdata.img artifacts/
          elif [ -f ~/.local/var/pmbootstrap/chroot_native/userdata.img ]; then
            cp ~/.local/var/pmbootstrap/chroot_native/userdata.img artifacts/
          else
            find ~/.local/var/pmbootstrap -name "userdata.img" -type f | head -1 | xargs -I{} cp {} artifacts/
          fi
          # kernel image
          find ~/.local/var/pmbootstrap -name "vmlinuz-linux-xiaomi-uke" -type f | head -1 | xargs -I{} cp {} artifacts/
          # initramfs
          find ~/.local/var/pmbootstrap -name "initramfs-*" -type f | head -1 | xargs -I{} cp {} artifacts/
          # List artifacts
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pmos-uke-images
          path: artifacts/
          retention-days: 30

      - name: Create release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  flash-instructions:
    name: Flash Instructions
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Print flash commands
        run: |
          echo "=== FLASH INSTRUCTIONS ==="
          echo ""
          echo "1. Put tablet in fastboot mode:"
          echo "   adb reboot bootloader"
          echo ""
          echo "2. Flash boot.img (both slots):"
          echo "   fastboot flash boot_a boot.img"
          echo "   fastboot flash boot_b boot.img"
          echo ""
          echo "3. Flash userdata.img:"
          echo "   fastboot flash userdata userdata.img"
          echo ""
          echo "4. Set active slot and reboot:"
          echo "   fastboot set_active a"
          echo "   fastboot reboot"
          echo ""
          echo "5. Default login: user / 147147"
          echo ""
          echo "Artifacts available at: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"